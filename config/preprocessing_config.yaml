
data:
  file_path: 'data/raw/healthcare-dataset-stroke-data.csv'

expected_columns:
  - 'id'
  - 'gender'
  - 'age'
  - 'hypertension'
  - 'heart_disease'
  - 'ever_married'
  - 'work_type'
  - 'Residence_type'
  - 'avg_glucose_level'
  - 'bmi'
  - 'smoking_status'
  - 'stroke'

value_ranges:
  age: [0, 120]
  bmi: [10, 70]
  avg_glucose_level: [0, 500]
  
data_split:
  dev_size: 610
  test_size: 500
  random_state: 42
  stratify_column: 'stroke'

missing_values:
  enabled:  true
  numeric:
    strategy: 'mean'
  categorical:
    strategy: 'mode'

# logging configuration
logging:
  log_dir: 'logs/'
  log_level: 'INFO'
  max_bytes: 10485760
  backup_count: 7
  format: '%(asctime)s -%(name) %(levelname)s -%(funcName)s:%(lineno)d - %(message)s'
  date_format: '%Y-%m-%d %H:%M:%S'

outliers:
  enabled: false
  cols_to_flag: ['avg_glucose_level','bmi']
  drop_original: false

duplicates:
  check_duplicates: true
  subset_cols: null 


encoding:
  one_hot_columns: true

transformations:
  log_columns: ['bmi','age','avg_glucose_level']
  drop_original: false

output:
  processed_dir: 'data/processed'
  pipeline_file: 'artifacts/data/preprocessing_pipeline.joblib'

columns_to_drop: ['id']

